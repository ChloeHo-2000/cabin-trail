<title>The Cabin Trail</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #120d06; --surface: #241808; --surface-2: #321f0a;
  --border: #6b4820; --hi: #c8a45a; --text: #f0e2c4; --muted: #9a7848;
  --px: 'Press Start 2P', monospace; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--px);
  min-height: 100%; display: flex; justify-content: center; align-items: flex-start;
  padding-block: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { width: 100%; max-width: 520px; }
.pbox {
  background: var(--surface); border: 4px solid var(--hi);
  box-shadow: inset 2px 2px 0 var(--surface-2), inset -2px -2px 0 #0a0804, 4px 4px 0 #0a0804;
  padding: 24px 20px; margin-bottom: 16px;
}
.screen { display: none; }
.screen.active { display: block; animation: fadein .2s ease; }
@keyframes fadein { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
@media (prefers-reduced-motion: reduce) { .screen.active { animation: none; } }
.intro-trees { display:flex; justify-content:center; gap:8px; margin-bottom:20px; }
.game-title { font-size:clamp(12px,4vw,20px); color:var(--hi); text-align:center; line-height:1.9; margin-bottom:20px; text-shadow:3px 3px 0 #1a0e04; letter-spacing:2px; }
.intro-copy { font-size:8px; line-height:2.5; color:var(--muted); text-align:center; margin-bottom:28px; }
.intro-copy em { color:var(--text); font-style:normal; }
.scene-banner { padding:14px 16px 14px; margin-bottom:0; }
.scene-cv { display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges; }
.prog-meta { display:flex; justify-content:space-between; font-size:6px; color:var(--muted); margin-bottom:6px; }
.prog-track { height:8px; background:var(--surface); border:2px solid var(--border); margin-bottom:0; overflow:hidden; }
.prog-fill { height:100%; background:var(--hi); transition:width .5s steps(10); }
.scene { font-size:8px; line-height:2.3; color:var(--muted); margin-bottom:14px; padding-bottom:14px; border-bottom:2px solid var(--border); }
.question { font-size:9px; line-height:2.2; color:var(--text); margin-bottom:22px; }
.opt { display:block; width:100%; background:var(--surface); border:2px solid var(--border); color:var(--text); font-family:var(--px); font-size:8px; padding:13px 14px; text-align:left; cursor:pointer; margin-bottom:10px; line-height:2; transition:background .05s,border-color .05s; }
.opt:hover { background:var(--surface-2); border-color:var(--hi); color:var(--hi); }
.opt:active { transform:translate(2px,2px); }
.opt.selected { background:var(--hi); color:var(--bg); border-color:var(--hi); pointer-events:none; }
.opt-lbl { color:var(--hi); margin-right:10px; }
.opt.selected .opt-lbl { color:var(--bg); }
.result-eyebrow { font-size:6px; color:var(--muted); text-align:center; letter-spacing:2px; margin-bottom:10px; }
.result-name { font-size:clamp(10px,3vw,15px); color:var(--hi); text-align:center; line-height:2; margin-bottom:20px; text-shadow:2px 2px 0 #1a0e04; }
.cabin-cv { display:block; margin:0 auto 20px; image-rendering:pixelated; image-rendering:crisp-edges; border:3px solid var(--border); }
.result-desc { font-size:7px; line-height:2.5; color:var(--text); text-align:center; margin-bottom:28px; }
.pbtn { font-family:var(--px); cursor:pointer; border:3px solid var(--hi); box-shadow:3px 3px 0 #0a0804; }
.pbtn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 #0a0804; }
.pbtn-gold { background:var(--hi); color:var(--bg); padding:14px 28px; font-size:9px; display:block; margin:0 auto; }
.pbtn-gold:hover { background:#f0e2c4; }
.pbtn-sm { background:var(--surface-2); color:var(--text); padding:11px 20px; font-size:7px; display:block; margin:0 auto; }
.pbtn-sm:hover { background:var(--border); }
</style>

<!-- INTRO -->
<div id="s-intro" class="screen active wrap">
  <div class="pbox" style="text-align:center">
    <div class="intro-trees">
      <canvas id="t1" width="24" height="52" style="image-rendering:pixelated"></canvas>
      <canvas id="t2" width="24" height="52" style="image-rendering:pixelated"></canvas>
      <canvas id="t3" width="24" height="52" style="image-rendering:pixelated"></canvas>
    </div>
    <div class="game-title">THE<br>CABIN<br>TRAIL</div>
    <p class="intro-copy">
      You've been away for days.<br>
      Somewhere ahead, deep in<br>
      the woods, <em>your cabin waits.</em><br><br>
      But first — the path has<br>
      questions for you.<br><br>
      Choose wisely, traveler.
    </p>
    <button class="pbtn pbtn-gold" onclick="startQuiz()">▶ &nbsp; BEGIN</button>
  </div>
</div>

<!-- QUESTION -->
<div id="s-question" class="screen wrap">
  <div class="pbox scene-banner">
    <canvas id="scene-cv" class="scene-cv" width="480" height="96"></canvas>
  </div>
  <div style="padding:12px 0 0; margin-bottom:16px;">
    <div class="prog-meta">
      <span id="q-lbl">Q 1 / 8</span>
      <span id="q-path-lbl"></span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  </div>
  <div class="pbox">
    <div class="scene" id="q-scene"></div>
    <div class="question" id="q-text"></div>
    <div id="q-opts"></div>
  </div>
</div>

<!-- RESULT -->
<div id="s-result" class="screen wrap">
  <div class="pbox" style="text-align:center">
    <div class="result-eyebrow">YOUR CABIN AWAITS</div>
    <canvas id="cabin-cv" class="cabin-cv" width="160" height="120"></canvas>
    <div class="result-eyebrow" style="margin-bottom:6px">YOUR STYLE IS</div>
    <div class="result-name" id="r-name"></div>
    <div class="result-desc" id="r-desc"></div>
    <button class="pbtn pbtn-sm" onclick="resetQuiz()">↺ &nbsp; PLAY AGAIN</button>
  </div>
</div>

<script>
const BLANK={MIN:0,JAP:0,WAB:0,COT:0,COA:0,MAX:0,IND:0,DAR:0};
let scores={...BLANK}, userPath=null, seq=[], qi=0, currentScene='forest';

const Q={
  q1:{scene:"You've been traveling for hours. The road splits into three. The air smells different down each path.",q:"Which way do you go?",opts:[
    {t:"Down a quiet lane lit by paper lanterns, where the sound of water follows you",s:"JAP"},
    {t:"Along an overgrown trail where old stone walls are slowly swallowed by moss",s:"WAB"},
    {t:"Toward the cliffs, where the wind is sharp and you can hear the sea below",s:"COA"}]},
  q2:{scene:"Night is falling. Three houses glow in the distance, each belonging to a different owner.",q:"Where do you choose to sleep?",path:true,opts:[
    {t:"With the fairy sisters — a rose-covered cottage, jam jars on the sill, firelight inside",s:"COT",p:"A"},
    {t:"With the woodcutter — a rundown warehouse, exposed pipes, brick still warm from the day",s:"IND",p:"B"},
    {t:"With the witch — her room stacked with tapestries, mismatched rugs, and a hundred collected things",s:"MAX",p:"C"}]},
  q3a:{tag:"PATH A · THE FAIRY SISTERS",scene:"The sisters wake you with singing. Each one needs a hand.",q:"Who do you help?",opts:[
    {t:"The eldest — wrapping handmade wooden utensils in linen, one by one, for the market stall",s:"JAP"},
    {t:"The second sister — patching the garden wall with river stones. It'll never be even, and that's fine",s:"WAB"},
    {t:"The youngest — hauling old iron pots from the cellar to oil and restore",s:"IND"}]},
  q4a:{tag:"PATH A · THE FAIRY SISTERS",scene:"Once chores are done, the sisters take you to a market hidden in a meadow clearing for lunch.",q:"What do you feel like eating?",opts:[
    {t:"A paper cone of fried fish and sea herbs, eaten walking along the meadow's edge",s:"COA"},
    {t:"A lone stall serving only one thing — black bread, hard cheese, and ink-dark plum jam",s:"DAR"},
    {t:"A vendor with no table, just baskets overflowing with every colour of food you've ever seen",s:"MAX"}]},
  q5a:{tag:"PATH A · THE FAIRY SISTERS",scene:"The youngest sister presses something into your hand before you leave.",q:"What is it?",opts:[
    {t:"A single clear vial of spring water — 'for when you need stillness,' she says",s:"MIN"},
    {t:"A worn field journal, already half full of pressed wildflowers and pencil sketches",s:"COT"},
    {t:"A small brass compass, dented but true — 'it'll always point you somewhere useful'",s:"IND"}]},
  q6a:{tag:"PATH A · THE FAIRY SISTERS",scene:"Before heading back, you rest by a still forest stream. The air smells like green things.",q:"What do you do?",opts:[
    {t:"Sit quietly and watch the light shift slowly across the surface",s:"JAP"},
    {t:"Notice a mossy stone with a crack running through it — it's beautiful like this",s:"WAB"},
    {t:"Kick off your shoes and wade in, feeling the cold current",s:"COA"}]},
  q7a:{tag:"PATH A · THE FAIRY SISTERS",scene:"You gather your things and leave for your cabin. The sisters wave from the gnarled oak.",q:"The eldest calls out one last thing. What does she say?",opts:[
    {t:"'Every room needs one true thing. Just one.'",s:"MIN"},
    {t:"'Fill your home with everything that makes you feel alive.'",s:"MAX"},
    {t:"'Let the dark in too — that's where the good stories live.'",s:"DAR"}]},
  q3b:{tag:"PATH B · THE WOODCUTTER",scene:"The woodcutter wakes you before sunrise. He needs a hand.",q:"What are you doing?",opts:[
    {t:"Stacking firewood in perfect, even columns against the barn wall",s:"MIN"},
    {t:"Gathering frost-covered herbs from the garden in the early quiet",s:"COT"},
    {t:"Loading his cart with a jumbled mix of tools, furs, and traded goods",s:"MAX"}]},
  q4b:{tag:"PATH B · THE WOODCUTTER",scene:"He takes you through a working town. One thing catches your eye.",q:"What is it?",opts:[
    {t:"A boat builder's yard — sea-weathered planks and the smell of salt and resin",s:"COA"},
    {t:"A locked archive building with iron letters above the door: 'Est. 1847'",s:"DAR"},
    {t:"A joinery workshop where every tool has its own marked place on the wall",s:"JAP"}]},
  q5b:{tag:"PATH B · THE WOODCUTTER",scene:"You wait by an iron bridge while he finishes a job.",q:"What holds your attention?",opts:[
    {t:"The way the bridge's shadow falls in a clean, exact line across the water",s:"JAP"},
    {t:"Rust blooming across the ironwork in patterns that look almost deliberate",s:"WAB"},
    {t:"A flat-bottomed boat drifting past, laundry drying on a line strung across it",s:"COA"}]},
  q6b:{tag:"PATH B · THE WOODCUTTER",scene:"Before you part, he hands you something for the road.",q:"What is it?",opts:[
    {t:"A folded cloth with one smooth, unmarked stone inside — 'keep it in your pocket'",s:"MIN"},
    {t:"A battered tin cup, dented and scorched — 'it's held up through everything'",s:"WAB"},
    {t:"A short iron chisel — 'always useful, never decorative'",s:"IND"}]},
  q7b:{tag:"PATH B · THE WOODCUTTER",scene:"He points you toward the road. Before turning back, he says one last thing.",q:"What does he say?",opts:[
    {t:"'Don't rush it. The best things are slow-built and well-loved.'",s:"COT"},
    {t:"'Take everything the world offers you — you can sort it later.'",s:"MAX"},
    {t:"'The old buildings know things. Pay attention to them.'",s:"DAR"}]},
  q3c:{tag:"PATH C · THE WITCH",scene:"The witch hands you a list before dawn. You go alone.",q:"What are you collecting?",opts:[
    {t:"One perfect white candle from the candlemaker — no scent, no decoration",s:"MIN"},
    {t:"Wildberry bundles and fresh beeswax from the herb stall",s:"COT"},
    {t:"Iron filings and black thread from the metalworker's back door",s:"IND"}]},
  q4c:{tag:"PATH C · THE WITCH",scene:"She takes you to a bazaar that exists only between midnight and dawn.",q:"Something makes you freeze mid-step. What is it?",opts:[
    {t:"A stall draped in sailcloth selling only light — lanterns of every shape and size",s:"COA"},
    {t:"A locked case of handwritten spell journals, centuries old, barely holding together",s:"DAR"},
    {t:"A stall so layered with colour and pattern and hanging things you can't see the back of it",s:"MAX"}]},
  q5c:{tag:"PATH C · THE WITCH",scene:"She stops at a crumbled stone structure to gather something. You wait.",q:"What do you notice?",opts:[
    {t:"The way the remaining walls frame the open sky — it feels designed this way",s:"JAP"},
    {t:"Lichen slowly swallowing carved inscriptions — patient and inevitable",s:"WAB"},
    {t:"A gap in the stones where the sea glitters in the far distance",s:"COA"}]},
  q6c:{tag:"PATH C · THE WITCH",scene:"Back at the cottage, the witch lights the fire and starts work. You watch her prepare something.",q:"What is she making?",opts:[
    {t:"A single-ingredient tincture — one herb, steeped in clear water. 'Less is the whole point,' she mutters",s:"MIN"},
    {t:"A slow-simmered brew from cracked bark and bruised petals — it smells like rain and old wood",s:"WAB"},
    {t:"A precise formula measured on small iron scales — seven drops of this, two grams of that",s:"IND"}]},
  q7c:{tag:"PATH C · THE WITCH",scene:"At first light, the witch is gone. On the table: the potion she made, still warm, and a note beside it. Three words.",q:"What does it say?",opts:[
    {t:"'Craft. Quiet. Purpose.'",s:"JAP"},
    {t:"'Grow something. Tend it.'",s:"COT"},
    {t:"'Knowledge is decoration.'",s:"DAR"}]},
  q8:{scene:"You push through the last of the trees. There it is — your cabin. Smoke rising, light in the window.",q:"What do you feel?",opts:[
    {t:"Relief — you know it's calm inside, just the way you left it",s:"MIN"},
    {t:"A deep pull toward something still and storied — it's been waiting for you",s:"DAR"},
    {t:"The solid satisfaction of something built to last — honest and real",s:"IND"}]}
};

const RESULTS={
  MIN:{name:"Minimalist",       desc:"Your cabin is an exhale.\nClean surfaces, considered\nobjects, space that does\nthe work. Nothing here\nby accident — everything\nhere on purpose.",    draw:drawMin},
  JAP:{name:"Japandi / Muji",   desc:"Your cabin is made with\ncare. Natural wood, honest\nmaterials, a quietness\nborn from craft.\nBeauty that earns\nits place.",             draw:drawJap},
  WAB:{name:"Wabi-sabi",        desc:"Your cabin tells time.\nWorn textures, imperfect\nedges, a patina that\nonly comes from living.\nNothing precious here —\neverything is real.", draw:drawWab},
  COT:{name:"Cottagecore",      desc:"Your cabin is a garden\nthat grew inside.\nHandmade things, beloved.\nIt smells like bread,\nlavender, and somewhere\nyou truly belong.",    draw:drawCot},
  COA:{name:"Coastal",          desc:"Your cabin is wide open.\nSalt air, linen, bleached\nwood and light that\nmoves all day. A\npermanent holiday you\nnever have to leave.", draw:drawCoa},
  MAX:{name:"Maximalist / Boho",desc:"Your cabin is alive.\nEvery surface holds a\nstory, every corner\nsurprises. Color, texture,\ncollected things — a\nportrait of everywhere.", draw:drawMax},
  IND:{name:"Industrial",       desc:"Your cabin doesn't\napologize. Raw materials,\nhonest structure, function\nmade beautiful. The\nbones are showing\nand they're magnificent.",draw:drawInd},
  DAR:{name:"Dark Academia",    desc:"Your cabin is a\nsanctuary. Rich wood,\ncandlelight, books on\nevery surface. Atmospheric,\nlayered, made for those\nwho feel everything.",   draw:drawDar}
};

const Q_SCENE={
  q1:'forest', q2:'three_houses',
  q3a:'cottage_ext', q4a:'meadow_mkt', q5a:'meadow_mkt', q6a:'stream', q7a:'cottage_ext',
  q3b:'warehouse',   q4b:'town_street', q5b:'iron_bridge', q6b:'town_street', q7b:'town_street',
  q3c:'night_errand',q4c:'bazaar',      q5c:'ruins',       q6c:'witch_cottage',q7c:'witch_cottage',
  q8:'cabin', result:'cabin'
};

// ─── LOGIC ────────────────────────────────────────────────────
function startQuiz(){scores={...BLANK};userPath=null;seq=['q1','q2'];qi=0;renderQ();}

function pick(opt,btn){
  btn.classList.add('selected');
  document.querySelectorAll('.opt').forEach(b=>b.style.pointerEvents='none');
  scores[opt.s]++;
  if(opt.p){
    userPath=opt.p;
    const paths={A:['q3a','q4a','q5a','q6a','q7a'],B:['q3b','q4b','q5b','q6b','q7b'],C:['q3c','q4c','q5c','q6c','q7c']};
    seq=['q1','q2',...paths[opt.p],'q8'];
  }
  qi++;
  const isResult=qi>=seq.length;
  const nextKey=isResult?'result':seq[qi];
  const nextScene=Q_SCENE[nextKey]||'forest';
  setTimeout(()=>{ walkOnScene(currentScene,nextScene,()=>{ if(isResult)showResult();else renderQ(); }); },120);
}

function renderQ(){
  const k=seq[qi],d=Q[k],scene=Q_SCENE[k]||'forest';
  currentScene=scene;
  const cv=document.getElementById('scene-cv');
  drawBg(cv.getContext('2d'),cv.width,cv.height,scene);
  document.getElementById('q-lbl').textContent=`Q ${qi+1} / 8`;
  document.getElementById('q-path-lbl').textContent=userPath?`PATH ${userPath}`:'';
  document.getElementById('prog').style.width=`${(qi/8)*100}%`;
  document.getElementById('q-scene').textContent=d.scene;
  document.getElementById('q-text').textContent='▸ '+d.q;
  const container=document.getElementById('q-opts');
  container.innerHTML='';
  ['A','B','C'].forEach((lbl,i)=>{
    const opt=d.opts[i],btn=document.createElement('button');
    btn.className='opt';
    btn.innerHTML=`<span class="opt-lbl">${lbl})</span>${opt.t}`;
    btn.onclick=()=>pick(opt,btn);
    container.appendChild(btn);
  });
  show('s-question');
}

function showResult(){
  document.getElementById('prog').style.width='100%';
  let top='MIN',topS=0;
  Object.entries(scores).forEach(([k,v])=>{if(v>topS){topS=v;top=k;}});
  const R=RESULTS[top];
  document.getElementById('r-name').textContent=R.name;
  document.getElementById('r-desc').textContent=R.desc;
  R.draw(document.getElementById('cabin-cv').getContext('2d'));
  show('s-result');
}

function resetQuiz(){show('s-intro');}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

// ─── WALK ANIMATION ──────────────────────────────────────────
let _walkId=null;
function walkOnScene(fromScene,toScene,onDone){
  if(_walkId){cancelAnimationFrame(_walkId);_walkId=null;}
  const cv=document.getElementById('scene-cv'),ctx=cv.getContext('2d'),CW=cv.width,CH=cv.height;
  let charX=-28,frame=0,frameT=0,lastTs=null;
  function loop(ts){
    if(!lastTs)lastTs=ts;
    const dt=Math.min((ts-lastTs)/1000,0.05); lastTs=ts;
    charX+=dt*185; frameT+=dt;
    if(frameT>0.17){frame^=1;frameT=0;}
    ctx.clearRect(0,0,CW,CH);
    drawBg(ctx,CW,CH,charX>CW*0.52?toScene:fromScene);
    drawChar(ctx,Math.round(charX),frame,CH);
    if(charX<CW+32){_walkId=requestAnimationFrame(loop);}
    else{_walkId=null;ctx.clearRect(0,0,CW,CH);drawBg(ctx,CW,CH,toScene);onDone();}
  }
  _walkId=requestAnimationFrame(loop);
}

// ─── SCENE BACKGROUNDS ───────────────────────────────────────
// Canvas: 480 × 96
function drawBg(ctx,W,H,scene){
  const f=(c,x=0,y=0,w=W,h=H)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
  const tri=(c,x1,y1,x2,y2,x3,y3)=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.closePath();ctx.fill();};
  const stars=(arr)=>{ctx.fillStyle='#f0e8d0';for(let i=0;i<arr.length;i+=2)ctx.fillRect(arr[i],arr[i+1],2,2);};

  // ── FOREST: Q1 — fork in the road ──
  if(scene==='forest'){
    f('#0d1a0d',0,0,W,56); f('#162412',0,56,W,H-56);
    // Three diverging paths
    ctx.fillStyle='#3a2610';
    tri('#3a2610', 200,96, 240,56, 280,96); // center path
    tri('#2e1e0a', 60,96,  130,56, 195,96); // left path
    tri('#2e1e0a', 285,96, 355,56, 430,96); // right path
    // Trees both sides
    for(let x=-8,i=0;x<130;x+=28,i++){const h=18+[8,14,6,10,16,4,12][i%7];tri('#08130a',x+12,56-h,x,56,x+24,56);}
    for(let x=365,i=0;x<W+20;x+=28,i++){const h=16+[12,6,14,8,10,16,4][i%7];tri('#08130a',x+12,56-h,x,56,x+24,56);}
    // A few middle trees
    tri('#0a1808',150,56-18,138,56,162,56);
    tri('#0a1808',318,56-20,306,56,330,56);
    // Paper lanterns on left path
    ctx.fillStyle='#d09030';[72,78,100,68,128,74].forEach((v,i,a)=>{if(i%2===0){ctx.fillRect(a[i]-3,a[i+1]-8,2,8);ctx.fillStyle='#f0c050';ctx.fillRect(a[i]-5,a[i+1]-12,6,5);ctx.fillStyle='#d09030';}});
    // Fireflies
    ctx.fillStyle='#90d830';[60,30,180,20,290,25,400,18,440,32].forEach((v,i,a)=>{if(i%2===0)ctx.fillRect(a[i],a[i+1],2,2);});
  }

  // ── THREE HOUSES: Q2 — choose where to sleep ──
  else if(scene==='three_houses'){
    f('#060410',0,0,W,60); f('#0e0c18',0,60,W,H-60); f('#12101e',0,70,W,H-70);
    stars([18,5,42,9,72,4,105,11,145,7,195,13,245,6,295,10,345,4,405,12,448,8,470,5]);
    // Moon
    ctx.fillStyle='#f0e890';ctx.beginPath();ctx.arc(455,18,11,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#060410';ctx.beginPath();ctx.arc(460,15,8,0,Math.PI*2);ctx.fill();

    // ═══ HOUSE 1: FAIRY COTTAGE (left) — rose stone cottage ═══
    // Stone body
    f('#705848',20,38,88,24);
    // Stone block texture
    ctx.fillStyle='#604838';
    for(let sx=22;sx<108;sx+=14)for(let sy=39;sy<62;sy+=8)ctx.fillRect(sx,sy,12,6);
    // Pointed roof
    tri('#4a2e18',20,38,64,14,108,38);
    // Chimney + smoke
    f('#5a3820',74,10,10,30); f('#2a1e0a',72,6,8,5); f('#201408',70,4,7,4);
    // Window — warm amber glow (double pane)
    f('#f8b030',28,42,22,14); f('#fff060',30,44,18,10);
    f('#604838',38,42,2,14); f('#604838',28,49,22,2); // panes
    // Jam jars on sill
    f('#d09030',28,52,5,3); f('#c84040',35,52,4,3); f('#40a840',41,52,4,3);
    // Second window
    f('#e89820',75,43,16,12); f('#ffd840',77,45,12,8);
    // Door — arched
    f('#2a1808',57,50,14,12);

// ─── CHARACTER SPRITE ─────────────────────────────────────────
function drawChar(ctx,screenX,frame,CH){
  const S=4,groundY=Math.round(CH*0.85);
  const x=screenX,y=groundY-11*S;
  const px=(dx,dy,c)=>{ctx.fillStyle=c;ctx.fillRect(x+dx*S,y+dy*S,S,S);};
  const SKIN='#f0b870',HAIR='#2a1808',COAT='#4a4030',PANTS='#2a3048',BOOT='#201008',PACK='#5a3820';
  px(1,0,HAIR);px(2,0,HAIR);px(3,0,HAIR);
  px(1,1,SKIN);px(2,1,SKIN);px(3,1,SKIN);
  px(1,2,SKIN);px(2,2,SKIN);px(3,2,SKIN);
  px(4,2,PACK);px(4,3,PACK);px(4,4,PACK);px(5,3,PACK);
  px(1,3,COAT);px(2,3,COAT);px(3,3,COAT);
  px(1,4,COAT);px(2,4,COAT);px(3,4,COAT);
  px(1,5,COAT);px(2,5,COAT);px(3,5,COAT);
  if(frame===0){px(0,3,COAT);}else{px(0,4,COAT);}
  if(frame===0){
    px(1,6,PANTS);px(1,7,PANTS);px(1,8,PANTS);px(0,9,BOOT);px(1,9,BOOT);
    px(3,6,PANTS);px(3,7,PANTS);px(3,8,PANTS);px(3,9,BOOT);px(4,9,BOOT);
  }else{
    px(1,6,PANTS);px(2,6,PANTS);px(2,7,PANTS);px(2,8,PANTS);px(1,9,BOOT);px(2,9,BOOT);
    px(3,6,PANTS);px(3,7,PANTS);px(3,8,PANTS);px(4,8,PANTS);px(3,9,BOOT);px(4,9,BOOT);
  }
}
